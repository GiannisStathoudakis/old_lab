apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: spring-apps
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world-watcher
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          as: checkout-repo
          config:
            repoURL: https://forgejo.lab.internal/admin1/Test.git
            checkout:
              - branch: main
                path: ./repo

        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/infra
            images:
              - image: harbor.lab.internal/test/hello-world
                tag: ${{ imageFrom('harbor.lab.internal/test/hello-world').Tag }}

        - uses: git-commit
          config:
            path: ./repo
            messageFromSteps:
              - update-image

        - uses: git-push
          config:
            path: ./repo