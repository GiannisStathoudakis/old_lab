apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: spring-apps
  annotations:
    kargo.akuity.io/auto-promotion-policy: Always
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world-watcher
      sources:
        direct: true 
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          as: checkout-repo
          config:
            repoURL: https://forgejo.lab.internal/admin1/Test.git
            checkout:
              - branch: master
                path: ./src

        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./src/infra
            images:
              - image: harbor.lab.internal/test/hello-world
                tag: ${{ imageFrom('harbor.lab.internal/test/hello-world').Tag }}

        - uses: git-commit
          config:
            path: ./src
            message: ${{ outputs['update-image'].commitMessage }}

        - uses: git-push
          config:
            path: ./src