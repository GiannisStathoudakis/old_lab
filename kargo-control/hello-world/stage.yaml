apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: spring-apps
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-world-watcher
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://forgejo.lab.internal/admin1/Test.git
            checkout:
              - branch: main
                path: ./src
        - uses: kustomize-set-image
          config:
            path: ./src/infra
            images:
              - image: harbor.lab.internal/test/hello-world
        - uses: git-commit
          config:
            path: ./src
            messageFromSteps:
              - kustomize-set-image
        - uses: git-push
          config:
            path: ./src