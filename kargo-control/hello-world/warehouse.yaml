apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world-watcher
  namespace: spring-apps
spec:
  interval: 5m0s
  subscriptions:
    - image:
        repoURL: harbor.lab.internal/test/hello-world
        imageSelectionStrategy: NewestBuild
        allowTags: "^[a-f0-9]{40}$"
        ignoreTags:
          - latest