apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: hello-world-watcher
  namespace: spring-apps
spec:
  credentials:
    name: kargo-harbor-secret
  interval: 5m0s
  subscriptions:
  - image:
      repoURL: harbor.lab.internal/test/hello-world
      imageSelectionStrategy: Lexical
      allowTags: ^[a-f0-9]{7,40}$