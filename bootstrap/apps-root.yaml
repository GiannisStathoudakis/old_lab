apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spring-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - app: hello-world
            repoURL: ssh://git@forgejo-ssh.forgejo-system.svc.cluster.local:22/admin1/Test.git
            path: infra
            namespace: spring-apps
  template:
    metadata:
      name: '{{app}}'
      annotations:
        argocd-image-updater.argoproj.io/image-list: spring-app=harbor.harbor-system.svc.cluster.local/test/{{app}}
        argocd-image-updater.argoproj.io/spring-app.update-strategy: newest-build
        argocd-image-updater.argoproj.io/write-back-method: git
    spec:
      project: default
      source:
        repoURL: '{{repoURL}}'
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true