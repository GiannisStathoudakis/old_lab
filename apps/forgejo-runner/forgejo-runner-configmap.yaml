apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runners
data:
  config.yaml: |
    runner:
      capacity: 5
    container:
      network: ""
      valid_volumes:
        - '**'
      options: "-v /certs/client"
      kubernetes:
        namespace: "forgejo-runners"
        pod_template: |
          apiVersion: v1
          kind: Pod
          metadata:
            generateName: forgejo-job-
          spec:
            containers:
              - name: job
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2000m"
                    memory: "2Gi"
                volumeMounts:
                  - name: workspace
                    mountPath: /workspace
            volumes:
              - name: workspace
                emptyDir:
                  sizeLimit: 4Gi