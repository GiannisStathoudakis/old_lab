apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runners
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  config.yaml: |
    runner:
      capacity: 1
      labels:
        - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
    container:
      network: "host" 
      options: "-v /workspace:/workspace"
      valid_volumes:
        - "/workspace"