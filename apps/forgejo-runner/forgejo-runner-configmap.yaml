apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runners
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  config.yaml: |
    runner:
      capacity: 5
      labels:
        - "ubuntu-latest:docker.io/gitea/runner-images:ubuntu-24.04"
    container:
      # Use the pod's network so Istio ambient mesh captures job traffic
      network: "host" 
      # Mount the Longhorn volume into the job containers
      options: "-v /workspace:/workspace"
      valid_volumes:
        - "/workspace"