apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: forgejo-runners
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  serviceName: forgejo-runner
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner-sa
      securityContext:
        # Ensures the Longhorn volume is writable by the rootless Docker daemon (UID 1000)
        fsGroup: 1000 
      containers:
        # Sidecar: Rootless Docker Daemon
        - name: dind-rootless
          image: docker:dind-rootless
          securityContext:
            # The compensated control: Lifts K8s filters so the node allows namespace creation.
            # The daemon itself still runs as an unprivileged user internally.
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: runner-workspace
              mountPath: /var/lib/docker
            - name: runner-workspace
              mountPath: /workspace
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true

        # Main: Forgejo Runner Orchestrator
        - name: runner
          image: code.forgejo.org/forgejo/runner:3.4.1
          securityContext:
            # Explicitly run the orchestrator as an unprivileged user
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
          command: ["sh", "-c"]
          args:
            - |
              while ! wget -q -O - http://localhost:2375/_ping; do sleep 2; done;
              
              forgejo-runner register \
                --no-interactive \
                --instance http://forgejo-http.forgejo-system.svc.cluster.local:3000/ \
                --token $(cat /secrets/token) \
                --name k8s-ambient-runner \
                --labels ubuntu-latest
              
              forgejo-runner daemon
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
            - name: token-volume
              mountPath: /secrets
              readOnly: true
            - name: runner-workspace
              mountPath: /workspace
      volumes:
        - name: config-volume
          configMap:
            name: forgejo-runner-config
        - name: token-volume
          secret:
            secretName: forgejo-runner-token
        - name: lib-modules
          hostPath:
            path: /lib/modules
  volumeClaimTemplates:
    - metadata:
        name: runner-workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn-single-replica"
        resources:
          requests:
            storage: 10Gi