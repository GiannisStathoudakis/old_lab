apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner-controller
  namespace: forgejo-runners
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  serviceName: "forgejo-runner" 
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      securityContext:
        fsGroup: 1000
      serviceAccountName: forgejo-runner-sa
      containers:
        # Rootless DinD Sidecar
        - name: dind
          image: docker:24-dind-rootless
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: false
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: dind-storage
              mountPath: /home/rootless/.local/share/docker

        - name: runner
          image: code.forgejo.org/forgejo/runner:3.4.1
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          command: ["sh", "-c"]
          args:
            - |
              sleep 10 
              if [ ! -f .runner ]; then
                forgejo-runner register \
                  --no-interactive \
                  --instance http://forgejo-http.forgejo-system.svc.cluster.local:3000 \
                  --token $(cat /secrets/token) \
                  --name k8s-ambient-runner \
                  --labels "ubuntu-latest:docker://gitea/runner-images:ubuntu-22.04"
              fi
              forgejo-runner daemon --config /config.yaml
          volumeMounts:
            - name: runner-state
              mountPath: /data
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
            - name: token-volume
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config-volume
          configMap:
            name: forgejo-runner-config
        - name: token-volume
          secret:
            secretName: forgejo-runner-token
  volumeClaimTemplates:
    - metadata:
        name: runner-state
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn-single-replica"
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: dind-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn-single-replica"
        resources:
          requests:
            storage: 20Gi