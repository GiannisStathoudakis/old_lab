apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: forgejo-runners
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  serviceName: forgejo-runner
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        # Sidecar: Rootless Docker Daemon
        - name: dind-rootless
          image: docker:dind-rootless
          securityContext:
            privileged: false
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: runner-workspace
              mountPath: /var/lib/docker
            - name: runner-workspace
              mountPath: /workspace

        # Main: Forgejo Runner
        - name: runner
          image: code.forgejo.org/forgejo/runner:3.4.1
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375" # Points to the local sidecar
          command: ["sh", "-c"]
          args:
            - |
              # Wait for the rootless sidecar to initialize
              while ! wget -q -O - http://localhost:2375/_ping; do sleep 2; done;
              
              forgejo-runner register \
                --no-interactive \
                --instance http://forgejo-http.forgejo-system.svc.cluster.local:3000/ \
                --token $(cat /secrets/token) \
                --name k8s-ambient-runner \
                --labels ubuntu-latest
              
              forgejo-runner daemon
          volumeMounts:
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
            - name: token-volume
              mountPath: /secrets
              readOnly: true
            - name: runner-workspace
              mountPath: /workspace
      volumes:
        - name: config-volume
          configMap:
            name: forgejo-runner-config
        - name: token-volume
          secret:
            secretName: forgejo-runner-token
  # Longhorn Persistent Storage replacing RAM
  volumeClaimTemplates:
    - metadata:
        name: runner-workspace
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn-single-replica"
        resources:
          requests:
            storage: 10Gi