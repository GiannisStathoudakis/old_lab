apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.2.2
    helm:
      values: |
        volumes:
          - name: vault-ca-cert
            secret:
              secretName: argocd-oidc-secret
              items:
                - key: rootCA
                  path: ca.crt
        
        volumeMounts:
          - name: vault-ca-cert
            mountPath: /etc/ssl/certs/vault-ca.crt
            subPath: ca.crt
            readOnly: true

        config:
          registries:
            - name: harbor
              prefix: harbor.lab.internal
              api_url: https://harbor.harbor-system.svc.cluster.local
              ping: yes
              credentials: pullsecret:argocd/harbor-pull-secret
        
        createClusterRoles: true
        rbac:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true