apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-traces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-traces-single
    targetRevision: 0.0.7 
    helm:
      values: |
        fullnameOverride: "victoria-traces"
        server:
          extraArgs:
            - "-otlpGRPCListenAddr=:4317"
            - "-otlpHTTPListenAddr=:4318"
            
          service:
            servicePort: 3200
            targetPort: 8428
            name: http
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
              - name: otlp-http
                port: 4318
                targetPort: 4318

          # --- LONGHORN PERSISTENCE ---
          persistentVolume:
            enabled: true
            size: 20Gi
            storageClassName: "longhorn-single-replica"

          retentionPeriod: 7d

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria
  syncPolicy:
    automated:
      prune: true
      selfHeal: true