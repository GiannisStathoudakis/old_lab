apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-traces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-traces-single
    targetRevision: 0.0.7 
    helm:
      values: |
        fullnameOverride: "victoria-traces"
        server:
          extraArgs:
            otlpGRPCListenAddr: ":4317"
            "otlpGRPC.tls": "false"
            httpListenAddr: ":3200"
            
          service:
            servicePort: 3200
            targetPort: 3200
            name: http

          # --- LONGHORN PERSISTENCE ---
          persistentVolume:
            enabled: true
            size: 20Gi
            storageClassName: "longhorn-single-replica"

          retentionPeriod: 7d

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria
  syncPolicy:
    automated:
      prune: true
      selfHeal: true