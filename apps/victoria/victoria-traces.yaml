apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-traces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-traces-single
    targetRevision: 0.0.7 
    helm:
      values: |
        fullnameOverride: "victoria-traces"
        server:
          extraArgs:
            otlpGRPCListenAddr: ":4317"
            "otlpGRPC.tls": "false"

          service:
            servicePort: 9411 
            name: http

          # --- LONGHORN PERSISTENCE ---
          persistentVolume:
            enabled: true
            size: 20Gi 
            storageClassName: "longhorn-single-replica"

          # After 7 days delete logs
          retentionPeriod: 7d

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria
  syncPolicy:
    automated:
      prune: true
      selfHeal: true