apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.153.0
    helm:
      values: |
        mode: deployment
        
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318

          exporters:
            prometheusremotewrite:
              endpoint: "http://victoria-metrics-server.victoria.svc.cluster.local:8428/api/v1/write"
              
            otlphttp/logs:
              endpoint: "http://victoria-logs-server.victoria.svc.cluster.local:9428/insert/otlp/v1/logs"
              tls:
                insecure: true

            otlphttp/traces:
              endpoint: "http://victoria-traces-server.victoria.svc.cluster.local:9411" 
              tls:
                insecure: true

          service:
            pipelines:
              metrics:
                receivers: [otlp]
                processors: []
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp]
                processors: []
                exporters: [otlphttp/logs]
              traces:
                receivers: [otlp]
                processors: []
                exporters: [otlphttp/traces]

  destination:
    server: https://kubernetes.default.svc
    namespace: victoria
  syncPolicy:
    automated:
      prune: true
      selfHeal: true