apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-secret-reader
  namespace: spring-apps
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-secret-reader-binding
  namespace: spring-apps
subjects:
- kind: ServiceAccount
  name: kargo-controller
  namespace: kargo
roleRef:
  kind: Role
  name: kargo-secret-reader
  apiGroup: rbac.authorization.k8s.io