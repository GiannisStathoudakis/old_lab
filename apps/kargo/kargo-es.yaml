apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ca-es
  namespace: kargo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-ca-secret
  data:
  - secretKey: ca.crt
    remoteRef:
      key: secret/data/kargo/authentik 
      property: CA
--- #harbor secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-harbor-secret
  namespace: spring-apps 
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-harbor-secret
    template:
      type: Opaque 
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: "harbor.lab.internal/test/hello-world"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      key: secret/data/kargo/harbor
      property: username
  - secretKey: password
    remoteRef:
      key: secret/data/kargo/harbor
      property: password
--- #forgejo secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-forgejo-es
  namespace: kargo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-forgejo-secret
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://forgejo.lab.internal/admin1/Test.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      key: secret/data/kargo/forgejo
      property: username
  - secretKey: password
    remoteRef:
      key: secret/data/kargo/forgejo
      property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin-es
  namespace: kargo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-api-secret
  data:
  - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
    remoteRef:
      key: secret/data/kargo/admin
      property: passwordHash
  - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
    remoteRef:
      key: secret/data/kargo/admin
      property: tokenSigningKey