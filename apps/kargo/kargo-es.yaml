#Authentik secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-oidc-es
  namespace: kargo
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kargo-oidc-secret
  data:
  - secretKey: oidc-client-secret
    remoteRef:
      key: secret/data/kargo/authentik 
      property: client_secret
  - secretKey: ca.crt
    remoteRef:
      key: secret/data/kargo/authentik 
      property: CA
--- #harbor secrets
