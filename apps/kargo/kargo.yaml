apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.10.5
    helm:
      values: |
        api:
          host: kargo.lab.internal
          tls:
            enabled: false
            terminatedUpstream: true

          extraEnv:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          
          # Force mount your CA into the standard Go path
          extraVolumes:
            - name: custom-ca
              secret:
                secretName: kargo-ca-secret
          extraVolumeMounts:
            - name: custom-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca.crt
              
          secret:
            name: kargo-api-secret
            
          cabundle:
            secretName: kargo-ca-secret

          oidc:
            enabled: true
            issuerURL: https://authentik.lab.internal/application/o/kargo
            clientID: "pi8nRMDJMMPhj6opG7nTycVOMsFUMNaX2SKvHYnI" 
            admins:
              claims:
                groups:
                  - "authentik Admins"

        controller:
          cabundle:
            secretName: kargo-ca-secret
          argocd:
            integrationEnabled: true
            namespace: argocd
            
          cabundle:
            secretName: kargo-ca-secret

  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true