apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.10.5
    helm:
      values: |
        api:
          host: kargo.lab.internal
          tls:
            enabled: false
            terminatedUpstream: true
          secret:
            name: kargo-api-secret
          oidc:
            enabled: true
            issuerURL: https://authentik.lab.internal/application/o/kargo/
            clientID: "pi8nRMDJMMPhj6opG7nTycVOMsFUMNaX2SKvHYnI" 
            clientSecretRef:
              name: kargo-oidc-secret
              key: oidc-client-secret
            caBundleSecretKeyRef:
              name: kargo-oidc-secret
              key: ca.crt
            admins:
              claims:
                groups:
                  - "authentik Admins"

        controller:
          argocd:
            integrationEnabled: true
            namespace: 
          
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            selector:
              release: victoria-metrics

  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true