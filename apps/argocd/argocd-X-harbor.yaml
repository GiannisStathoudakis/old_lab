apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: argocd-harbor-repo
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-repo-credentials
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        url: harbor.harbor-system.svc.cluster.local
        type: helm
        enableOCI: "true"
        name: harbor-internal
        username: "{{ .harbor_user }}"
        password: "{{ .harbor_pass }}"
        insecure: "true"
  data:
  - secretKey: harbor_user
    remoteRef:
      key: secret/argocd/harbor
      property: username
  - secretKey: harbor_pass
    remoteRef:
      key: secret/argocd/harbor
      property: password