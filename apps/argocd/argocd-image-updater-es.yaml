apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: argocd-harbor-pull-secret-sync
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "harbor.lab.internal": {
                "auth": "{{ printf \"%s:%s\" .username .password | b64enc }}"
              }
            }
          }
  data:
  - secretKey: username
    remoteRef:
      key: secret/data/argocd/harbor
      property: username
  - secretKey: password
    remoteRef:
      key: secret/data/argocd/harbor
      property: password