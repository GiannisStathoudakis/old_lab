apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor-system
spec:
  secretName: harbor-tls-secret 
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  commonName: harbor.lab.internal
  dnsNames:
    - harbor.lab.internal
    - harbor.harbor-system.svc.cluster.local